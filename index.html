
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#190b16">
<title>A Heartshot of Love ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#160914;color:white;font-family:'Cormorant Garamond',serif}

.scene{
 position:relative;width:100%;height:100vh;height:100dvh;
 overflow:hidden;isolation:isolate;
 background:radial-gradient(ellipse at 50% 48%,#57213e 0%,#301323 48%,#100711 100%);
}
.ambient{
 position:absolute;inset:0;z-index:-3;
 background:radial-gradient(circle at 20% 30%,#ff9ac51d,transparent 35%),
 radial-gradient(circle at 80% 70%,#e8a1ff18,transparent 35%);
 animation:ambient 8s ease-in-out infinite alternate;
}
@keyframes ambient{to{transform:scale(1.15);opacity:.7}}

.stars{position:absolute;inset:0;pointer-events:none;z-index:-1}
.star{
 position:absolute;width:3px;height:3px;border-radius:50%;
 background:#ffe5f1;box-shadow:0 0 10px #ffb5d5;
 animation:twinkle 2s infinite alternate;
}
@keyframes twinkle{
 from{opacity:.2;transform:scale(.6)}
 to{opacity:1;transform:scale(1.5)}
}

.heading{
 position:absolute;top:7%;left:0;width:100%;text-align:center;
 padding:0 12px;z-index:2;animation:fadeDown 1.8s ease both;
}
.heading h1{
 font-family:'Great Vibes',cursive;font-size:clamp(38px,9vw,66px);
 font-weight:400;color:#ffe1ec;text-shadow:0 0 22px #ff8bb8a8;
}
.heading p{
 margin-top:7px;font-size:12px;letter-spacing:4px;
 text-transform:uppercase;color:#e9b9cc;
}
@keyframes fadeDown{
 from{opacity:0;transform:translateY(-20px)}
 to{opacity:1;transform:translateY(0)}
}

/* BALLOON */
.balloon-wrap{
 position:absolute;left:50%;top:35%;
 width:190px;height:240px;
 transform:translate(-50%,-50%);
 display:flex;justify-content:center;align-items:center;
 z-index:3;animation:balloonFloat 3.6s ease-in-out infinite;
}
@keyframes balloonFloat{
 0%,100%{translate:0 0;rotate:-2deg}
 50%{translate:0 -13px;rotate:2deg}
}
.heart-balloon{
 position:relative;width:112px;height:112px;
 background:radial-gradient(circle at 30% 24%,#ffbed6 0%,#ff78a7 20%,#ec3478 60%,#a4104e 100%);
 transform:rotate(-45deg);border-radius:15px 0 15px 0;
 box-shadow:inset 8px 7px 16px #ffffff50,inset -12px -12px 22px #65052e6e,0 0 35px #ff4c93a1,0 0 85px #ff4c9335;
}
.heart-balloon:before,.heart-balloon:after{
 content:"";position:absolute;width:112px;height:112px;
 border-radius:50%;background:inherit;box-shadow:inherit;
}
.heart-balloon:before{top:-56px;left:0}
.heart-balloon:after{left:56px;top:0}
.balloon-shine{
 position:absolute;z-index:2;width:19px;height:38px;
 top:-32px;left:22px;background:#ffffff90;
 border-radius:50%;transform:rotate(45deg);filter:blur(3px);
}
.balloon-knot{
 position:absolute;z-index:3;width:12px;height:12px;
 left:calc(50% - 6px);bottom:39px;
 background:#b51d59;transform:rotate(45deg);
}
.balloon-string{
 position:absolute;top:175px;left:50%;height:65px;width:1px;
 background:linear-gradient(#f9b6d2,#ffffff55,transparent);
}
.balloon-label{
 position:absolute;z-index:5;left:50%;top:50%;
 transform:translate(-50%,-50%);width:100%;
 text-align:center;font-family:'Great Vibes',cursive;
 font-size:25px;color:#fff2f7;
 text-shadow:0 2px 8px #8e1648;pointer-events:none;
}

/* ARCHER - FIXED BOTTOM CENTER */
.archer{
 position:absolute;
 left:50%;
 bottom:7%;
 width:190px;
 height:245px;
 z-index:10;
 cursor:pointer;
 -webkit-tap-highlight-color:transparent;
 transform:translateX(-50%);
 transform-origin:center bottom;
 animation:archerEnter 1.5s ease both;
 filter:drop-shadow(0 0 8px #e8b66a88)
        drop-shadow(0 0 18px #e8b66a33);
}
@keyframes archerEnter{
 from{opacity:0;translate:0 15px}
 to{opacity:1;translate:0 0}
}
.archer svg{width:100%;height:100%;overflow:visible}

/* ROTATED BOW: ARROW POINTS UP */
.bow-art{
 width:100%;height:100%;
 transform:rotate(-90deg);
 transform-origin:50% 50%;
 overflow:visible;
}
.bow{
 fill:none;stroke:url(#gold);stroke-width:8;
 stroke-linecap:round;filter:drop-shadow(0 0 5px #f5c77a);
}
.bow-highlight{
 fill:none;stroke:#fff0c2;stroke-width:1.5;opacity:.8;
}
.bow-string{
 fill:none;stroke:#fff0c9;stroke-width:2.2;stroke-linecap:round;
}
.string-pull{
 fill:none;stroke:#fff0c9;stroke-width:2.2;
 stroke-linecap:round;transform-origin:70px 105px;
}
.arrow-held{transform-origin:70px 105px}
.arrow-shaft{stroke:#f8d79d;stroke-width:4;stroke-linecap:round}
.arrow-tip{fill:#ffe5aa;stroke:#fff3d1;stroke-width:1}
.arrow-feather{fill:#d79a54;stroke:#ffe4b0;stroke-width:1}
.grip{fill:#8d4e32;stroke:#f4c879;stroke-width:2}

.rose-vine{
 fill:none;stroke:#d7a65d;stroke-width:2.3;
 stroke-linecap:round;stroke-linejoin:round;
 filter:drop-shadow(0 0 3px #e9b96d);
}
.rose-leaf{fill:#527044;stroke:#d8b16e;stroke-width:1.1}
.rose-leaf-vein{fill:none;stroke:#e9c68b;stroke-width:.9}
.rose-petal{fill:url(#roseGold);stroke:#ffe0a1;stroke-width:1}
.rose-core{fill:#9e3d39;stroke:#ffdc9b;stroke-width:1}
.rose-detail{fill:none;stroke:#fff0c2;stroke-width:1;opacity:.85}

.archer.pulling .string-pull{animation:drawString .45s ease-in forwards}
.archer.pulling .arrow-held{animation:drawArrow .45s ease-in forwards}
@keyframes drawString{to{transform:translateX(-25px)}}
@keyframes drawArrow{to{transform:translateX(-25px)}}

.archer.releasing{animation:bowRecoil .35s ease-out}
.archer.releasing .arrow-held{opacity:0}
@keyframes bowRecoil{
 0%{scale:1}
 40%{scale:.94}
 100%{scale:1}
}

.archer-glow{
 position:absolute;inset:8px;border:1px solid #ffd99b55;
 border-radius:50%;pointer-events:none;
 animation:archerPulse 2.2s infinite;
}
@keyframes archerPulse{
 0%{transform:scale(.85);opacity:.8}
 100%{transform:scale(1.3);opacity:0}
}

.tap-label{
 position:absolute;
 left:50%;
 bottom:calc(7% + 245px);
 transform:translateX(-50%);
 width:100%;text-align:center;
 color:#f6d6a6;font-size:10px;letter-spacing:2px;
 text-transform:uppercase;animation:softPulse 2s infinite;
 z-index:10;
}
@keyframes softPulse{50%{opacity:.5}}

/* FLYING ARROW */
.flying-arrow{
 position:absolute;width:52px;height:4px;border-radius:5px;
 background:linear-gradient(90deg,#b87938,#fff0b9);
 opacity:0;z-index:12;transform-origin:left center;
 filter:drop-shadow(0 0 8px #ffe2a5);pointer-events:none;
}
.flying-arrow:before{
 content:"";position:absolute;right:-14px;top:-6px;
 border-left:17px solid #ffe4a5;
 border-top:8px solid transparent;
 border-bottom:8px solid transparent;
}
.flying-arrow:after{
 content:"";position:absolute;left:-12px;top:-5px;
 border-right:12px solid #c58c45;
 border-top:7px solid transparent;
 border-bottom:7px solid transparent;
}

/* BALLOON BURST */
.scene.hit .balloon-wrap{animation:balloonBurst .48s ease-in forwards}
@keyframes balloonBurst{
 0%{transform:translate(-50%,-50%) scale(1)}
 20%{transform:translate(-50%,-50%) scale(1.13,.86) rotate(7deg)}
 42%{transform:translate(-50%,-50%) scale(.83,1.16) rotate(-8deg)}
 65%{transform:translate(-50%,-50%) scale(1.1,.8) rotate(8deg)}
 100%{transform:translate(-50%,-50%) scale(0) rotate(30deg);opacity:0}
}

.flash{
 position:absolute;left:50%;top:35%;
 width:20px;height:20px;border-radius:50%;
 background:white;opacity:0;z-index:8;
 transform:translate(-50%,-50%);pointer-events:none;
}
.scene.hit .flash{animation:impactFlash .55s ease-out forwards}
@keyframes impactFlash{
 0%{opacity:1;box-shadow:0 0 20px 10px white,0 0 70px 35px #ff9bc9}
 100%{opacity:0;transform:translate(-50%,-50%) scale(16)}
}

.burst-piece{
 position:absolute;left:50%;top:35%;width:17px;height:29px;
 background:linear-gradient(135deg,#ffb0ce,#e52c72,#8b1648);
 border-radius:70% 15% 70% 15%;opacity:0;z-index:7;
 pointer-events:none;
}
.scene.hit .burst-piece{animation:latexBurst 1.05s ease-out forwards}
@keyframes latexBurst{
 0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}
 100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2) rotate(var(--r))}
}

.particle{
 position:absolute;left:50%;top:35%;
 z-index:10;pointer-events:none;
 animation:particleFly 1.7s ease-out forwards;
}
@keyframes particleFly{
 0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}
 100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.5)}
}

.instruction{
 position:absolute;bottom:2%;left:0;width:100%;
 text-align:center;padding:0 12px;
 color:#f7dce7;font-size:16px;letter-spacing:1px;z-index:4;
}

/* MOBILE */
@media(max-width:600px){
 .heading{top:6%}
 .heading h1{font-size:clamp(38px,10vw,56px)}
 .heading p{font-size:10px;letter-spacing:3px}

 .balloon-wrap{
  left:50%;top:35%;
  transform:translate(-50%,-50%) scale(.88);
 }

 .archer{
  left:50%;bottom:7%;
  width:180px;height:235px;
 }

 .tap-label{bottom:calc(7% + 235px);font-size:9px}
 .instruction{bottom:2%;font-size:14px}
}

/* SHORT SCREENS */
@media(max-height:650px){
 .heading{top:2%}

 .balloon-wrap{
  top:31%;
  transform:translate(-50%,-50%) scale(.72);
 }

 .archer{
  left:50%;width:145px;height:185px;bottom:5%;
 }

 .tap-label{bottom:calc(5% + 185px)}
 .instruction{font-size:12px;bottom:1%}
}

@media(prefers-reduced-motion:reduce){
 .star,.ambient,.balloon-wrap,.archer,.archer-glow,.tap-label{
  animation-duration:8s;
 }
}
</style>
</head>

<body>
<div class="scene" id="scene">
 <div class="ambient"></div>
 <div class="stars" id="stars"></div>

 <header class="heading">
  <h1>A Heartshot of Love</h1>
  <p>A little magic, made only for you</p>
 </header>

 <div class="balloon-wrap" id="balloon">
  <div class="heart-balloon">
   <div class="balloon-shine"></div>
  </div>
  <div class="balloon-knot"></div>
  <div class="balloon-string"></div>
  <div class="balloon-label">My Love</div>
 </div>

 <!-- ARCHER -->
 <div class="archer" id="archer"
      role="button" tabindex="0"
      aria-label="Pull the bow and shoot">

  <div class="archer-glow"></div>

  <svg viewBox="0 0 160 220" xmlns="http://www.w3.org/2000/svg">
   <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
     <stop offset="0" stop-color="#fff0bd"/>
     <stop offset=".45" stop-color="#d7a04f"/>
     <stop offset="1" stop-color="#8d5727"/>
    </linearGradient>

    <linearGradient id="roseGold" x1="0" y1="0" x2="1" y2="1">
     <stop offset="0" stop-color="#fff0c2"/>
     <stop offset=".45" stop-color="#d99a55"/>
     <stop offset="1" stop-color="#9e493c"/>
    </linearGradient>
   </defs>

   <g class="bow-art">
    <path class="bow" d="M72 15 Q5 105 72 205"/>
    <path class="bow-highlight" d="M72 15 Q17 105 72 205"/>

    <path class="rose-vine"
     d="M66 33 Q36 55 48 83 Q57 100 48 121 Q38 145 58 169 Q67 181 68 193"/>

    <path class="rose-vine"
     d="M48 83 Q26 75 22 58 M48 121 Q22 130 23 151 M58 169 Q83 160 91 174"/>

    <path class="rose-leaf" d="M39 67 Q20 49 20 65 Q25 80 39 67Z"/>
    <path class="rose-leaf-vein" d="M23 64 Q31 66 38 68"/>

    <path class="rose-leaf" d="M49 91 Q68 75 65 92 Q61 105 49 91Z"/>
    <path class="rose-leaf-vein" d="M51 91 Q58 91 64 92"/>

    <path class="rose-leaf" d="M36 135 Q17 126 20 142 Q27 153 36 135Z"/>
    <path class="rose-leaf-vein" d="M22 137 Q29 137 35 136"/>

    <path class="rose-leaf" d="M62 163 Q82 149 79 166 Q72 178 62 163Z"/>
    <path class="rose-leaf-vein" d="M64 164 Q72 165 78 165"/>

    <g transform="translate(35 48)">
     <path class="rose-petal"
      d="M0 -13 C-17 -20 -21 -2 -9 5 C-23 16 -5 25 4 12 C19 22 25 3 10 -3 C15 -19 1 -24 0 -13Z"/>

      d="M-7 -5 Q0 -15 8 -5 Q14 3 4 9 Q-7 13 -9 3Z"/>

      d="M-5 -3 Q0 1 5 -4 M-3 5 Q3 8 7 3"/>

    <g transform="translate(48 119) scale(.65)">
     <path class="rose-petal"
      d="M0 -13 C-17 -20 -21 -2 -9 5 C-23 16 -5 25 4 12 C19 22 25 3 10 -3 C15 -19 1 -24 0 -13Z"/>
     <path class="rose-core"
      d="M-7 -5 Q0 -15 8 -5 Q14 3 4 9 Q-7 13 -9 3Z"/>
     <path class="rose-detail" d="M-5 -3 Q0 1 5 -4"/>
    </g>

    <g transform="translate(64 175) scale(.48)">
     <path class="rose-petal"
      d="M0 -13 C-17 -20 -21 -2 -9 5 C-23 16 -5 25 4 12 C19 22 25 3 10 -3 C15 -19 1 -24 0 -13Z"/>
     <path class="rose-core"
      d="M-7 -5 Q0 -15 8 -5 Q14 3 4 9 Q-7 13 -9 3Z"/>
    </g>

    <path class="grip"
     d="M65 91 Q79 105 65 126 L58 119 Q68 108 58 101 Z"/>

    <path d="M62 101 L70 110 L62 119"
     fill="none" stroke="#ffe0a1" stroke-width="2"/>

    <path class="bow-string" d="M72 15 L70 105 L72 205"/>
    <path class="string-pull" d="M72 15 L70 105 L72 205"/>

    <g class="arrow-held">
     <path class="arrow-shaft" d="M70 105 L153 105"/>
     <path class="arrow-tip" d="M153 105 L135 95 L140 105 L135 115 Z"/>

     <path class="arrow-feather" d="M75 105 L63 88 L67 105 L63 122 Z"/>
    </g>

    <circle cx="72" cy="15" r="5" fill="#ffe6ae"/>
    <circle cx="72" cy="205" r="5" fill="#ffe6ae"/>
    <circle cx="25" cy="91" r="2" fill="#ffe3a6"/>

   </g>
  </svg>
 </div>

 <div class="tap-label">✦ Touch the archer ✦</div>

 <div class="instruction" id="instruction">
  One arrow... One heart... Endless love.
 </div>

 <div class="flying-arrow" id="flyingArrow"></div>
 <div class="flash"></div>
</div>

<script>
const scene=document.getElementById("scene");
const archer=document.getElementById("archer");
const balloon=document.getElementById("balloon");
const flyingArrow=document.getElementById("flyingArrow");
const instruction=document.getElementById("instruction");

let started=false;

/* AUDIO: BACKGROUND MUSIC */
const backgroundMusic=new Audio("audio/romantic.mp3");
backgroundMusic.loop=true;
backgroundMusic.volume=0.24;
backgroundMusic.preload="auto";

/* AUDIO: SHARED SOUND CONTEXT */
let soundContext=null;

function getSoundContext(){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return null;

  if(!soundContext){
   soundContext=new AC();
  }

  if(soundContext.state==="suspended"){
   soundContext.resume();
  }

  return soundContext;
 }catch(e){
  return null;
 }
}

/* AUDIO: START MUSIC AFTER FIRST USER ACTION */
function startBackgroundMusic(){
 try{
  backgroundMusic.play().catch(()=>{});
 }catch(e){}
}

/* AUDIO: BOW DRAW */
function playDrawSound(){
 const ctx=getSoundContext();
 if(!ctx)return;

 try{
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  const filter=ctx.createBiquadFilter();

  osc.type="triangle";
  osc.frequency.setValueAtTime(170,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(390,ctx.currentTime+.42);

  filter.type="lowpass";
  filter.frequency.setValueAtTime(700,ctx.currentTime);
  filter.frequency.linearRampToValueAtTime(1300,ctx.currentTime+.42);

  gain.gain.setValueAtTime(.001,ctx.currentTime);
  gain.gain.linearRampToValueAtTime(.075,ctx.currentTime+.12);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.46);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);

  osc.start();
  osc.stop(ctx.currentTime+.48);
 }catch(e){}
}

/* AUDIO: ARROW RELEASE AND FLIGHT WHOOSH */
function playArrowWhoosh(){
 const ctx=getSoundContext();
 if(!ctx)return;

 try{
  const duration=.65;
  const bufferSize=Math.floor(ctx.sampleRate*duration);
  const buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);
  const data=buffer.getChannelData(0);

  for(let i=0;i<bufferSize;i++){
   const fade=1-(i/bufferSize);
   data[i]=(Math.random()*2-1)*fade;
  }

  const noise=ctx.createBufferSource();
  const filter=ctx.createBiquadFilter();
  const gain=ctx.createGain();

  noise.buffer=buffer;

  filter.type="bandpass";
  filter.frequency.setValueAtTime(1100,ctx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(350,ctx.currentTime+.55);
  filter.Q.value=.7;

  gain.gain.setValueAtTime(.001,ctx.currentTime);
  gain.gain.linearRampToValueAtTime(.16,ctx.currentTime+.07);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.62);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);

  noise.start();
  noise.stop(ctx.currentTime+.65);

  const release=ctx.createOscillator();
  const releaseGain=ctx.createGain();

  release.type="sine";
  release.frequency.setValueAtTime(420,ctx.currentTime);
  release.frequency.exponentialRampToValueAtTime(180,ctx.currentTime+.16);

  releaseGain.gain.setValueAtTime(.09,ctx.currentTime);
  releaseGain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);

  release.connect(releaseGain);
  releaseGain.connect(ctx.destination);

  release.start();
  release.stop(ctx.currentTime+.19);
 }catch(e){}
}

/* AUDIO: ORIGINAL BALLOON BURST SOUND RETAINED */
function playBurstSound(){
 try{
  const ctx=getSoundContext();
  if(!ctx)return;

  const osc=ctx.createOscillator();
  const gain=ctx.createGain();

  osc.type="sine";
  osc.frequency.setValueAtTime(620,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(150,ctx.currentTime+.22);

  gain.gain.setValueAtTime(.13,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.26);

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start();
  osc.stop(ctx.currentTime+.27);
 }catch(e){}
}

/* AUDIO: MAGICAL HEART REVEAL CHIME */
function playRevealChime(){
 const ctx=getSoundContext();
 if(!ctx)return;

 try{
  const notes=[659.25,783.99,987.77];

  notes.forEach((frequency,index)=>{
   const osc=ctx.createOscillator();
   const gain=ctx.createGain();

   const startTime=ctx.currentTime+(index*.09);

   osc.type="sine";
   osc.frequency.setValueAtTime(frequency,startTime);

   gain.gain.setValueAtTime(.001,startTime);
   gain.gain.linearRampToValueAtTime(.045,startTime+.035);
   gain.gain.exponentialRampToValueAtTime(.001,startTime+.65);

   osc.connect(gain);
   gain.connect(ctx.destination);

   osc.start(startTime);
   osc.stop(startTime+.68);
  });
 }catch(e){}
}

/* STARS */
const stars=document.getElementById("stars");

for(let i=0;i<75;i++){
 const star=document.createElement("span");
 star.className="star";
 star.style.left=Math.random()*100+"%";
 star.style.top=Math.random()*100+"%";
 star.style.animationDelay=Math.random()*3+"s";
 star.style.animationDuration=(1.5+Math.random()*3)+"s";
 stars.appendChild(star);
}

/* BALLOON PIECES */
function createBurstPieces(){
 for(let i=0;i<22;i++){
  const piece=document.createElement("div");
  piece.className="burst-piece";

  const angle=(Math.PI*2*i)/22;
  const distance=75+Math.random()*170;

  piece.style.setProperty("--x",Math.cos(angle)*distance+"px");
  piece.style.setProperty("--y",Math.sin(angle)*distance+"px");
  piece.style.setProperty("--r",(Math.random()*760-380)+"deg");
  piece.style.animationDelay=(Math.random()*.1)+"s";

  scene.appendChild(piece);
 }
}

/* FLYING HEARTS */
function createHearts(){
 const symbols=["♥","♡","✦","✧","❤"];

 for(let i=0;i<48;i++){
  const p=document.createElement("span");
  p.className="particle";

  p.textContent=symbols[Math.floor(Math.random()*symbols.length)];
  p.style.color=Math.random()>.5?"#ffd1e2":"#ffe5ae";
  p.style.fontSize=(12+Math.random()*24)+"px";

  p.style.setProperty("--x",(Math.random()*500-250)+"px");
  p.style.setProperty("--y",(Math.random()*500-250)+"px");
  p.style.animationDelay=(Math.random()*.25)+"s";

  scene.appendChild(p);
 }
}

/* FLYING ARROW - FIXED SIZE AND ACCURATE IMPACT */
function launchArrow(){
 const sceneRect=scene.getBoundingClientRect();
 const archerRect=archer.getBoundingClientRect();
 const balloonRect=balloon.getBoundingClientRect();

 // Arrow starting point at the archer.
 const startX=archerRect.left-sceneRect.left+archerRect.width/2;
 const startY=archerRect.top-sceneRect.top+archerRect.height*.43;

 // Exact center of the heart balloon.
 const targetX=balloonRect.left-sceneRect.left+balloonRect.width/2;
 const targetY=balloonRect.top-sceneRect.top+balloonRect.height/2;

 const dx=targetX-startX;
 const dy=targetY-startY;

 const angle=Math.atan2(dy,dx)*180/Math.PI;
 const radians=Math.atan2(dy,dx);

 // Keep the arrow at its original fixed size.
 const arrowWidth=52;

 // Full distance from arrow origin to arrow tip.
 const tipLength=83;

 // Position the arrow so its tip reaches the balloon center.
 const endX=targetX-Math.cos(radians)*tipLength;
 const endY=targetY-Math.sin(radians)*tipLength;

 flyingArrow.style.width=arrowWidth+"px";
 flyingArrow.style.left=startX+"px";
 flyingArrow.style.top=(startY-2)+"px";
 flyingArrow.style.transform=`rotate(${angle}deg)`;
 flyingArrow.style.opacity="1";

 flyingArrow.animate([
  {
   left:startX+"px",
   top:(startY-2)+"px",
   transform:`rotate(${angle}deg)`,
   opacity:1
  },
  {
   left:endX+"px",
   top:(endY-2)+"px",
   transform:`rotate(${angle}deg)`,
   opacity:1
  }
 ],{
  duration:650,
  easing:"cubic-bezier(.18,.72,.32,1)",
  fill:"forwards"
 });
}

/* SHOOT SEQUENCE */
function shootArrow(){
 if(started)return;

 started=true;
 archer.style.pointerEvents="none";

 /* AUDIO: MUSIC AND BOW DRAW */
 startBackgroundMusic();
 playDrawSound();

 instruction.textContent="Drawing the bow... aiming for your heart. ❤️";
 archer.classList.add("pulling");

 setTimeout(()=>{
  archer.classList.remove("pulling");
  archer.classList.add("releasing");

  instruction.textContent="And the arrow flies... ❤️";

  /* AUDIO: ARROW RELEASE */
  playArrowWhoosh();

  launchArrow();
 },500);

 setTimeout(()=>{
  scene.classList.add("hit");
  instruction.textContent="Straight to the heart... ❤️";

  createBurstPieces();
  createHearts();

  /* AUDIO: BALLOON IMPACT AND HEART REVEAL */
  playBurstSound();
  playRevealChime();
 },1200);

 // Direct navigation to Stage 2.
 // No heart zoom, screen wash or fade transition.
 setTimeout(()=>{
  window.location.href="stage2.html";
 },3100);
}

/* CLICK AND KEYBOARD */
archer.addEventListener("click",shootArrow);

archer.addEventListener("keydown",e=>{
 if(e.key==="Enter"||e.key===" "){
  e.preventDefault();
  shootArrow();
 }
});
</script>
</body>
</html>
